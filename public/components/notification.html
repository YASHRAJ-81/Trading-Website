<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      background-color: #0a0a0a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Loader Animation */
    .spinner {
      border: 4px solid rgba(255,255,255,0.2);
      border-left-color: #4ade80;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="text-white">

  <!-- Top Bar -->
  <div id="notification-bar" class="bg-gradient-to-r from-emerald-600 to-green-700 shadow-lg flex items-center gap-3 px-5 py-3 fixed top-0 inset-x-0 z-50">
    <button onclick="goBack()" class="text-white hover:text-gray-200 text-xl transition" aria-label="Go back">←</button>
    <span class="font-semibold text-lg">🔔 Important Account Notifications</span>
  </div>

  <!-- Main Content -->
  <main class="pt-20 px-4 pb-10 max-w-3xl mx-auto">
    <div id="notificationsContainer" class="space-y-4">
      <div class="flex flex-col items-center justify-center py-12 space-y-4">
        <div class="spinner"></div>
        <p class="text-gray-300 italic">Loading notifications...</p>
      </div>
    </div>
  </main>

  <script>
    function goBack() {
      window.location.href = document.referrer || '/profile.html';
    }

    async function loadNotifications() {
      const container = document.getElementById('notificationsContainer');
      container.innerHTML = `
        <div class="flex flex-col items-center justify-center py-12 space-y-4">
          <div class="spinner"></div>
          <p class="text-gray-300 italic">Loading notifications...</p>
        </div>
      `;
      try {
        const response = await fetch('/notifications', { cache: 'no-store' });
        if (!response.ok) throw new Error('Failed to fetch notifications');
        const data = await response.json();

        if (!data.success || !Array.isArray(data.notifications) || data.notifications.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center pt-12 space-y-3 fade-in">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0a3 3 0 11-6 0h6z"/>
              </svg>
              <p class="text-gray-400 italic">You have no new notifications.</p>
            </div>
          `;
          return;
        }

        const html = data.notifications.map(n => `
          <div class="notification flex items-start gap-4 p-4 bg-gray-900 rounded-lg shadow border border-gray-700 hover:border-emerald-500 transition duration-200 fade-in">
            <div class="flex-shrink-0">
              <svg class="w-6 h-6 text-emerald-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0a3 3 0 11-6 0h6z"/>
              </svg>
            </div>
            <div>
              <p class="text-base leading-snug">${n.message}</p>
              <p class="text-xs text-gray-500 mt-1">${new Date(n.date || Date.now()).toLocaleString()}</p>
            </div>
          </div>
        `).join('');
        container.innerHTML = html;
      } catch (error) {
        console.error('Error loading notifications:', error);
        container.innerHTML = `
          <div class="text-center text-red-400 pt-12 fade-in">
            ⚠ Failed to load notifications. Please try again later.
          </div>
        `;
      }
    }

    window.onload = loadNotifications;
  </script>
</body>
</html>
