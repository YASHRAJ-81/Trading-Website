<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 text-white min-h-screen flex items-center justify-center relative">
  <!-- Back to Profile fixed at top left -->
  <div class="fixed top-4 left-4 z-50 max-w-xs">
    <button 
      onclick="goBack()" 
      class="text-sm text-blue-300 underline mb-[1cm]"
    >
      ← Back to Profile
    </button>
    <p class="text-xs text-yellow-300">
      For the safety of your funds, withdrawal is not allowed within 24 hours. Contact Receptionists for more details.
    </p>
  </div>

  <div class="p-6 rounded shadow-md w-full max-w-md">
    <h2 class="text-xl font-semibold mb-4">🔒 Change Password</h2>
    <div id="error" class="text-red-400 text-sm mb-2"></div>
    <form onsubmit="handleChangePassword(event)" class="space-y-4">
      
      <div class="relative">
        <input name="oldPassword" type="password" placeholder="Old Password" required class="w-full p-2 rounded text-black pr-10" />
        <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-900" onclick="togglePassword(this)">
          👁️
        </button>
      </div>

      <div class="relative">
        <input name="newPassword" type="password" placeholder="New Password" required class="w-full p-2 rounded text-black pr-10" />
        <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-900" onclick="togglePassword(this)">
          👁️
        </button>
      </div>

      <div class="relative">
        <input name="confirmPassword" type="password" placeholder="Confirm New Password" required class="w-full p-2 rounded text-black pr-10" />
        <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-900" onclick="togglePassword(this)">
          👁️
        </button>
      </div>

      <button type="submit" class="bg-yellow-500 w-full py-2 rounded hover:bg-yellow-600 transition">Update Password</button>
    </form>
  </div>

  <script>
    function goBack() {
      window.location.href = "/profile.html";
    }

    function togglePassword(button) {
      const input = button.previousElementSibling;
      if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
      } else {
        input.type = "password";
        button.textContent = "👁️";
      }
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());

      const res = await fetch('/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await res.json();
      if (result.success) {
        alert("Password updated successfully!");
        window.location.href = "/profile.html";
      } else {
        document.getElementById('error').textContent = result.message;
      }
    }
  </script>
</body>
</html>
