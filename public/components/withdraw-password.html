<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Withdraw Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

  <!-- Header -->
  <div class="bg-[#0a9376] px-4 py-4 flex items-center">
    <button onclick="goBack()" class="mr-4">
      <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <h1 class="text-lg font-semibold">🔑 Withdraw Password</h1>
  </div>

  <!-- Form -->
  <div class="p-6 flex-1">
    <form id="withdraw-password-form" class="space-y-4">
      
      <!-- New Password -->
      <div>
        <label class="block mb-1 font-medium">New Withdraw Password</label>
        <div class="relative">
          <input type="password" id="new-password" required class="w-full p-2 pr-10 rounded bg-white-800 text-black border border-gray-700 focus:outline-none focus:ring-2 focus:ring-[#0a9376]" />
          <button type="button" onclick="togglePassword('new-password', this)" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" id="eye-new-password" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block mb-1 font-medium">Confirm Password</label>
        <div class="relative">
          <input type="password" id="confirm-password" required class="w-full p-2 pr-10 rounded bg-white-800 text-black border border-gray-700 focus:outline-none focus:ring-2 focus:ring-[#0a9376]" />
          <button type="button" onclick="togglePassword('confirm-password', this)" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" id="eye-confirm-password" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-[#0a9376] py-2 rounded font-semibold hover:bg-teal-600 transition">
        Set Withdraw Password
      </button>
    </form>

    <!-- Success/Error Message -->
    <p id="message" class="text-sm mt-4 text-center hidden"></p>
  </div>

  <!-- Scripts -->
  <script>
    function goBack() {
      window.history.back();
    }

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);
      const eyeIcon = button.querySelector('svg');

      if (input.type === "password") {
        input.type = "text";
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.662-2.928m3.262-2.52A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.956 9.956 0 01-4.165 5.104M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 3l18 18" />
        `;
      } else {
        input.type = "password";
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z" />
        `;
      }
    }

    document.getElementById('withdraw-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const messageEl = document.getElementById('message');

      messageEl.classList.add('hidden');

      if (newPassword !== confirmPassword) {
        messageEl.innerText = "Passwords do not match.";
        messageEl.className = "text-sm mt-4 text-center text-red-400";
        return;
      }

      try {
        const response = await fetch('/update-withdraw-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ withdrawPassword: newPassword })
        });

        const result = await response.json();

        if (response.ok) {
          messageEl.innerText = "Password submitted successfully. Wait for few minutes.";
          messageEl.className = "text-sm mt-4 text-center text-gray-400";
        } else {
          messageEl.innerText = result.error || "Failed to update.";
          messageEl.className = "text-sm mt-4 text-center text-red-400";
        }
      } catch (err) {
        messageEl.innerText = "Server error. Try again.";
        messageEl.className = "text-sm mt-4 text-center text-red-400";
      }
    });
  </script>
</body>
</html>
