<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assets - Trade History</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: linear-gradient(120deg,#1f2937 80%, #374151 100%);
    color: white;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    box-sizing: border-box;
  }
  header {
    background: rgba(55,65,81,0.94);
    padding: 1rem;
    text-align: center;
    position: relative;
    box-shadow: 0 1px 8px #0003;
    z-index: 2;
  }
  main {
    flex-grow: 1;
    padding: 1.2rem;
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
  }
</style>
</head>
<body>

<header>
  <button onclick="history.back()" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-sm bg-gray-600 hover:bg-gray-700 text-white px-2 py-1 rounded shadow transition-all duration-150">
    ←
  </button>
  <h1 class="text-xl font-bold select-none">Assets - All Trade History</h1>
</header>

<main>
  <div id="tradeHistoryContainer" class="flex flex-col gap-4 items-stretch">Loading trades...</div>
</main>

<script>
const tradeHistoryContainer = document.getElementById('tradeHistoryContainer');

async function fetchTradeHistory() {
  try {
    const res = await fetch('/trade-history');
    if (!res.ok) throw new Error('Unauthorized or fetch error');
    const data = await res.json();
    renderTrades(data.trades || []);
  } catch (err) {
    tradeHistoryContainer.textContent = 'Failed to load trade history.';
    console.warn(err);
  }
}

function renderTrades(trades) {
  tradeHistoryContainer.innerHTML = '';
  if (!trades.length) {
    tradeHistoryContainer.textContent = 'No trades found.';
    return;
  }

  trades.forEach(trade => {
    // Card container
    const card = document.createElement('div');
    card.className = `
      group
      bg-gradient-to-br from-[#22283e] via-[#23272f] to-[#1e2129]
      border border-gray-800 rounded-xl
      shadow-lg
      px-5 py-4
      relative
      hover:border-blue-400
      transition-colors
      cursor-pointer
      overflow-visible
      max-w-full
    `;
    card.style.position = 'relative';
    card.style.zIndex = '1';

    // Trade summary row with improved layout
    card.innerHTML = `
      <div class="flex flex-row items-center justify-between gap-2">
        <div class="flex flex-row items-center gap-3 min-w-0">
          <strong class="text-base font-medium text-gray-100 truncate max-w-[120px]" title="${trade.pair}">
            ${trade.pair}
          </strong>
          <span class="text-xl ${trade.direction === 'Buy UP' ? 'text-green-400' : 'text-red-400'} font-bold shrink-0">${trade.direction === 'Buy UP' ? '↑' : '↓'}</span>
          <span class="px-2 py-1 bg-gray-600 rounded text-sm font-mono shrink-0">${trade.timeframe}s</span>
        </div>
        <div class="flex items-center gap-2 text-sm min-w-[140px] justify-end">
          <span class="${trade.result === 'WIN' ? 'text-green-400 font-semibold' : 'text-red-400 font-semibold'}">${trade.result}</span>
          <span class="mx-2 text-gray-300 select-none">|</span>
          <span>Profit/Loss: <b class="${trade.profit >= 0 ? 'text-green-400' : 'text-red-400'}">${Number(trade.profit).toFixed(2)}</b></span>
        </div>
      </div>
    `;

    // Details (hidden by default)
    const details = document.createElement('div');
    details.className = `
      trade-details-expanded
      border border-blue-400/30
      backdrop-blur-md
      bg-gray-900/85
      rounded-xl
      px-4 py-5
      mt-3
      text-sm
      text-blue-100
      shadow-xl
      transition-all
      duration-300
      overflow-hidden
      break-words
      opacity-0
      pointer-events-none
    `;
    details.style.position = 'relative';
    details.style.maxHeight = '0px';

    // Improved details layout
    details.innerHTML = `
      <div class="font-semibold mb-2 text-lg text-blue-300">Trade Details</div>
      <div class="grid grid-cols-2 gap-x-4 gap-y-1 break-words">
        <div class="truncate"><span class="text-gray-400">Pair:</span> <span class="font-bold" title="${trade.pair}">${trade.pair}</span></div>
        <div class="break-words"><span class="text-gray-400">Direction:</span> <span class="font-bold">${trade.direction}</span></div>
        <div class="break-words"><span class="text-gray-400">Amount:</span> <span class="font-bold">${trade.amount}</span></div>
        <div class="break-words"><span class="text-gray-400">Timeframe:</span> <span class="font-bold">${trade.timeframe}s</span></div>
        <div class="break-words"><span class="text-gray-400">Profit %:</span> <span class="font-bold">${trade.profitPercent}%</span></div>
        <div class="break-words"><span class="text-gray-400">Result:</span> <span class="font-bold ${trade.result === 'WIN' ? 'text-green-400' : 'text-red-400'}">${trade.result}</span></div>
        <div class="break-words"><span class="text-gray-400">Profit/Loss:</span> <span class="font-bold ${trade.profit >= 0 ? 'text-green-400' : 'text-red-400'}">${trade.profit}</span></div>
        <div class="break-words"><span class="text-gray-400">Timestamp:</span> <span class="font-bold">${new Date(trade.timestamp).toLocaleString()}</span></div>
      </div>
    `;

    // Toggle expansion animation and layout
    card.addEventListener('click', function () {
      const isVisible = details.style.opacity === '1';
      // Close all other details
      document.querySelectorAll('.trade-details-expanded').forEach(el => {
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        el.style.maxHeight = '0px';
        el.style.marginTop = '0px';
      });
      if (!isVisible) {
        details.style.opacity = '1';
        details.style.pointerEvents = 'auto';
        details.style.maxHeight = '520px';
        details.style.marginTop = '12px';
      } else {
        details.style.opacity = '0';
        details.style.pointerEvents = 'none';
        details.style.maxHeight = '0px';
        details.style.marginTop = '0px';
      }
    });

    card.appendChild(details);
    tradeHistoryContainer.appendChild(card);
  });
}

fetchTradeHistory();
</script>
</body>
</html>
