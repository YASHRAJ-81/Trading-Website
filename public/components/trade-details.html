<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trade Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .active-btn {
      background-color: black;
      border: 1px solid white;
      color: white;
    }
    .active-btn:hover {
      opacity: 0.9;
    }
    body, html {
      height: 100%;
      margin: 0;
      overflow-y: auto;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #errorMessage {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

  <!-- Top Bar with Back Button -->
  <div class="flex items-center p-4 bg-gray-800 shadow-md flex-shrink-0 justify-center relative">
    <button onclick="goBack()" class="absolute left-4 text-xl select-none">← </button>
    <h1 id="headerTitle" class="text-xl font-semibold"></h1>
  </div>

  <div id="tradeDetailsContainer" class="px-4 py-4 space-y-4 flex-grow">
    <div>
      <label class="block mb-1">Timeframe (seconds):</label>
      <div class="grid grid-cols-4 gap-2">
        <button onclick="selectOption('timeframe', 60)" class="py-2 rounded bg-gray-700" id="tf-60">60s</button>
        <button onclick="selectOption('timeframe', 90)" class="py-2 rounded bg-gray-700" id="tf-90">90s</button>
        <button onclick="selectOption('timeframe', 120)" class="py-2 rounded bg-gray-700" id="tf-120">120s</button>
        <button onclick="selectOption('timeframe', 180)" class="py-2 rounded bg-gray-700" id="tf-180">180s</button>
      </div>
    </div>

    <div>
      <label class="block mb-1">Profit %:</label>
      <div class="grid grid-cols-4 gap-2">
        <button onclick="selectOption('profit', 30)" class="py-2 rounded bg-gray-700" id="p-30">30%</button>
        <button onclick="selectOption('profit', 50)" class="py-2 rounded bg-gray-700" id="p-50">50%</button>
        <button onclick="selectOption('profit', 70)" class="py-2 rounded bg-gray-700" id="p-70">70%</button>
        <button onclick="selectOption('profit', 100)" class="py-2 rounded bg-gray-700" id="p-100">100%</button>
      </div>
    </div>

    <div>
      <label class="block mb-1">Amount:</label>
      <input id="tradeAmount" type="number" min="1" placeholder="Enter amount" class="w-full px-3 py-2 rounded bg-gray-800 text-white" />
      <small id="balanceHint" class="text-gray-400 italic"></small>
    </div>

    <button onclick="submitTrade()" class="w-full bg-green-600 py-2 rounded text-lg font-semibold" id="placeOrderBtn">Place Order</button>
    <div id="errorMessage" class="text-red-400 mt-2 text-sm hidden"></div>

    <!-- Popup (replaces the timer area). Shows a live countdown synced with the selected timeframe -->
    <div id="tradePopup" class="hidden py-4">
      <div class="mx-auto w-full max-w-md rounded-lg overflow-hidden shadow-lg bg-gradient-to-br from-gray-800 to-gray-700">
        <div class="p-4 text-center">
          <div class="inline-block rounded-full border-2 border-yellow-500 p-4 mb-2">
            <!-- Big realtime countdown (seconds) -->
            <div id="popupTimerBig" class="text-5xl font-bold text-yellow-400">60</div>
            
            <div id="popupPair" class="text-sm text-gray-300 mt-1">BTC/USDT</div>
          </div>
        </div>

        <div class="px-5 pb-4">
          <div class="bg-gray-800 rounded p-3 mb-3">
            <div class="flex justify-between text-sm text-gray-300 mb-2">
              <span>Type</span>
              <span id="popupType" class="font-semibold">Buy UP</span>
            </div>
            <div class="flex justify-between text-sm text-gray-300">
              <span>Amount</span>
              <span id="popupAmount" class="font-semibold">1000.00</span>
            </div>
          </div>

          <button id="popupContinueBtn" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded text-lg font-semibold text-white">
            Continue to place an order
          </button>
          <button id="popupCancelBtn" class="w-full mt-2 text-center text-sm text-gray-400 underline">Cancel</button>
        </div>
      </div>
    </div>
    <!-- END popup -->

    <div class="pt-6 pb-6">
      <h2 class="text-lg font-semibold mb-2 flex items-center gap-1">
        Recent Trades
        <span class="text-gray-400 text-xs italic" title="Click trade rows below to see details"></span>
      </h2>
      <div id="tradeHistory" class="space-y-2 max-h-48 overflow-y-auto"></div>
      <div id="expandedTradeDetails" class="bg-gray-800 p-3 rounded text-sm hidden whitespace-pre-line"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'tradeTimerData';

    const urlParams = new URLSearchParams(window.location.search);
    const currentPair = urlParams.get('pair') || 'BTCUSDT';
    const selectedDirection = urlParams.get('direction') || null;

    const headerTitle = document.getElementById('headerTitle');
    headerTitle.textContent = `${currentPair.slice(0, 3)}/${currentPair.slice(3)} — Buy ${selectedDirection}`;

    let selected = { direction: selectedDirection, timeframe: null, profit: null };
    let tradeRunning = false;
    let currentTradeData = null;
    let timerInterval = null;
    let userBalance = 0;

    const balanceHint = document.getElementById('balanceHint');
    const errorMessageEl = document.getElementById('errorMessage');

    function selectOption(type, value) {
      if (tradeRunning) return;
      selected[type] = value;
      const ids = {
        timeframe: ['tf-60', 'tf-90', 'tf-120', 'tf-180'],
        profit: ['p-30', 'p-50', 'p-70', 'p-100'],
      };
      ids[type].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.remove('active-btn', 'bg-yellow-600');
      });
      const btnId = type === 'timeframe' ? `tf-${value}` : `p-${value}`;
      const btn = document.getElementById(btnId);
      if (btn) btn.classList.add('active-btn', 'bg-yellow-600');
    }

    function setInputsDisabled(disabled) {
      document.getElementById('placeOrderBtn').disabled = disabled;
      document.getElementById('tradeAmount').disabled = disabled;
      ['tf-60', 'tf-90', 'tf-120', 'tf-180', 'p-30', 'p-50', 'p-70', 'p-100'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.disabled = disabled;
      });
    }

    function showError(msg) {
      errorMessageEl.textContent = msg;
      errorMessageEl.classList.remove('hidden');
    }
    function clearError() {
      errorMessageEl.textContent = '';
      errorMessageEl.classList.add('hidden');
    }

    function clearTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // Start a live timer that counts down to `endTimestamp` (ms since epoch).
    function startTimer(endTimestamp) {
      clearTimer();
      const bigEl = document.getElementById('popupTimerBig');

      function update() {
        const now = Date.now();
        const remainingMs = endTimestamp - now;
        const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
        if (bigEl) bigEl.textContent = String(remainingSec);

        if (remainingMs <= 0) {
          clearTimer();
          // remove stored timer
          localStorage.removeItem(STORAGE_KEY);
          // finalize trade automatically
          // small delay so UI shows 0 briefly
          setTimeout(() => finalizeTrade(), 250);
        }
      }

      update(); // immediate update
      timerInterval = setInterval(update, 250);
    }

    // Shows the inline popup and starts a timer for `timeframe` seconds.
    function showTradePopup(trade, timeframeSeconds) {
      const popup = document.getElementById('tradePopup');
      if (!popup) return;

      // determine fields to display (prefer data from server's trade object; fall back to calculated values)
      const pairText = trade.pair || `${currentPair.slice(0,3)}/${currentPair.slice(3)}`;
      const directionText = trade.direction || (selected.direction === 'UP' ? 'Buy UP' : 'Buy DOWN');
      const amountText = (trade.amount != null) ? parseFloat(trade.amount).toFixed(2) : (trade.amount || '0.00');

      // fill popup UI
      const typeEl = document.getElementById('popupType');
      const amountEl = document.getElementById('popupAmount');
      const pairEl = document.getElementById('popupPair');

      if (typeEl) typeEl.textContent = directionText;
      if (amountEl) amountEl.textContent = amountText;
      if (pairEl) pairEl.textContent = pairText;

      // compute end timestamp and persist to localStorage so refresh resumes it
      const endsAt = Date.now() + (Number(timeframeSeconds) * 1000);
      const store = {
        endsAt,
        pair: pairText,
        amount: amountText,
        direction: directionText
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));

      // show popup and lock inputs
      popup.classList.remove('hidden');
      setInputsDisabled(true);
      tradeRunning = true;
      currentTradeData = trade; // keep reference for finalize

      // wire buttons
      const contBtn = document.getElementById('popupContinueBtn');
      if (contBtn) {
        contBtn.onclick = async function () {
          // user confirmed early — remove stored timer, clear interval and finalize
          localStorage.removeItem(STORAGE_KEY);
          clearTimer();
          popup.classList.add('hidden');
          await finalizeTrade();
        };
      }

      const cancelBtn = document.getElementById('popupCancelBtn');
      if (cancelBtn) {
        cancelBtn.onclick = function () {
          // client-side cancel: hide popup, clear timer and re-enable inputs.
          popup.classList.add('hidden');
          localStorage.removeItem(STORAGE_KEY);
          clearTimer();
          tradeRunning = false;
          currentTradeData = null;
          setInputsDisabled(false);
          clearError();
        };
      }

      // start the live countdown
      startTimer(endsAt);

        // Smooth scroll to make sure the popup is visible
  
  if (popup) {
    popup.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

    }

    // Show popup using an already-saved localStorage entry (used on page load)
    function restorePopupFromStorage(stored) {
      const popup = document.getElementById('tradePopup');
      if (!popup) return;

      if (stored.pair) {
        const pairEl = document.getElementById('popupPair');
        if (pairEl) pairEl.textContent = stored.pair;
      }
      if (stored.amount) {
        const amountEl = document.getElementById('popupAmount');
        if (amountEl) amountEl.textContent = stored.amount;
      }
      if (stored.direction) {
        const typeEl = document.getElementById('popupType');
        if (typeEl) typeEl.textContent = stored.direction;
      }

      popup.classList.remove('hidden');
      setInputsDisabled(true);
      tradeRunning = true;
      // start countdown towards stored.endsAt
      startTimer(stored.endsAt);

      // wire buttons same as showTradePopup
      const contBtn = document.getElementById('popupContinueBtn');
      if (contBtn) {
        contBtn.onclick = async function () {
          localStorage.removeItem(STORAGE_KEY);
          clearTimer();
          popup.classList.add('hidden');
          await finalizeTrade();
        };
      }
      const cancelBtn = document.getElementById('popupCancelBtn');
      if (cancelBtn) {
        cancelBtn.onclick = function () {
          popup.classList.add('hidden');
          localStorage.removeItem(STORAGE_KEY);
          clearTimer();
          tradeRunning = false;
          currentTradeData = null;
          setInputsDisabled(false);
          clearError();
        };
      }
    }

    function hideTradePopup() {
      const popup = document.getElementById('tradePopup');
      if (!popup) return;
      popup.classList.add('hidden');
      clearTimer();
      localStorage.removeItem(STORAGE_KEY);
    }

    async function refreshProfileBalance() {
      try {
        const res = await fetch('/profile-data');
        if (!res.ok) throw new Error('Unauthorized');
        const data = await res.json();
        userBalance = parseFloat(data.balance) || 0;
        updateBalanceHint();
      } catch (err) {
        console.error('Failed to refresh profile:', err);
      }
    }

    function updateBalanceHint() {
      const hint = document.getElementById('balanceHint');
      if (hint) {
        hint.textContent = `Balance: ${userBalance.toFixed(2)}`;
      }
    }

    async function submitTrade() {
      if (tradeRunning) {
        alert('Please wait until the current trade finishes.');
        return;
      }

      const amountEl = document.getElementById('tradeAmount');
      const amount = parseFloat(amountEl.value);
      if (!selected.direction || !selected.timeframe || !selected.profit || !amount || isNaN(amount) || amount <= 0) {
        showError('Please fill all fields correctly.');
        return;
      }
      if (amount > userBalance) {
        showError(`Insufficient balance. Your current balance is ${userBalance.toFixed(2)}.`);
        return;
      }
      clearError();

      const timeframeSelected = selected.timeframe;
      const profitSelected = selected.profit;

      // reset selections visually and lock inputs (we keep this behavior)
      selected.timeframe = null;
      selected.profit = null;
      ['tf-60', 'tf-90', 'tf-120', 'tf-180', 'p-30', 'p-50', 'p-70', 'p-100'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.remove('active-btn', 'bg-yellow-600');
        if (btn) btn.disabled = true;
      });
      amountEl.value = '';
      amountEl.disabled = true;
      document.getElementById('placeOrderBtn').disabled = true;

      const tradeData = {
        pair: `${currentPair.slice(0, 3)}/${currentPair.slice(3)}`,
        direction: selected.direction === 'UP' ? 'Buy UP' : 'Buy DOWN',
        amount,
        profitPercent: profitSelected,
        timeframe: timeframeSelected,
      };

      try {
        const res = await fetch('/place-trade', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(tradeData)
        });
        const data = await res.json();

        if (!data.success) {
          showError(data.message || 'Trade failed.');
          tradeRunning = false;
          setInputsDisabled(false);
          return;
        }

        // server responded with created trade; keep reference
        currentTradeData = data.trade || tradeData;

        // show popup with live timer (client-side timeframe used)
        showTradePopup(currentTradeData, timeframeSelected);

      } catch (err) {
        showError(`Error placing trade: ${err.message}`);
        tradeRunning = false;
        setInputsDisabled(false);
      }
    }

    async function finalizeTrade() {
      // ensure popup is hidden, timer cleared and storage removed
      hideTradePopup();

      // refresh balance and trade-history like before
      await refreshProfileBalance();
      await fetchTradeHistory();

      tradeRunning = false;
      setInputsDisabled(false);
      currentTradeData = null;

      ['tf-60', 'tf-90', 'tf-120', 'tf-180', 'p-30', 'p-50', 'p-70', 'p-100'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.remove('active-btn', 'bg-yellow-600');
      });

      const amtEl = document.getElementById('tradeAmount');
      if (amtEl) amtEl.value = '';
    }

    const tradeHistoryEl = document.getElementById('tradeHistory');
    const detailsEl = document.getElementById('expandedTradeDetails');

    async function fetchTradeHistory() {
      try {
        const res = await fetch('/trade-history');
        if (!res.ok) throw new Error('Unauthorized');
        const data = await res.json();
        const trades = data.trades || [];
        renderTrades(trades.slice(0, 4));
      } catch (err) {
        tradeHistoryEl.innerHTML = `<div class="text-gray-400 text-center">Failed to load trades.</div>`;
        console.warn(err);
      }
    }

    function renderTrades(trades) {
      tradeHistoryEl.innerHTML = '';
      detailsEl.classList.add('hidden');
      detailsEl.textContent = '';

      if (!trades.length) {
        tradeHistoryEl.innerHTML = '<div class="text-gray-400 text-center">No trades yet.</div>';
        return;
      }

      trades.forEach(trade => {
        const div = document.createElement('div');
        div.className = 'trade-entry cursor-pointer transition bg-gray-800 rounded p-2 flex justify-between';
        div.title = 'Click to toggle trade details';
        div.innerHTML = `
          <div>
            ${trade.pair} &nbsp;
            <span>${trade.direction === 'Buy UP' ? '↑' : '↓'}</span> &nbsp;
            <span>${trade.timeframe}s</span>
          </div>
          <div class="${trade.result === 'WIN' ? 'text-green-400' : 'text-red-400'}">
            ${trade.result === 'WIN' ? '+' : '-'}${Math.abs(parseFloat(trade.profit)).toFixed(2)}
            <span class="trade-arrow">▼</span>
          </div>
        `;
        // clicking a trade entry toggles details (keeps old UI behavior)
        div.onclick = function () {
          toggleDetails(trade);
        };
        tradeHistoryEl.appendChild(div);
      });
    }

    function toggleDetails(trade) {
      if (detailsEl.dataset.tradeId === String(trade.id)) {
        detailsEl.classList.add('hidden');
        detailsEl.textContent = '';
        delete detailsEl.dataset.tradeId;
        return;
      }
      detailsEl.dataset.tradeId = trade.id;
      detailsEl.classList.remove('hidden');
      detailsEl.textContent = `
Pair: ${trade.pair}
Direction: ${trade.direction}
Amount: ${trade.amount}
Timeframe: ${trade.timeframe}s
Profit %: ${trade.profitPercent}%
Result: ${trade.result}
Profit/Loss: ${trade.profit}
Timestamp: ${new Date(trade.timestamp).toLocaleString()}
      `.trim();
    }

    function goBack() {
      const params = new URLSearchParams({
        pair: currentPair,
        direction: selected.direction
      });
      window.location.href = `trade.html?${params.toString()}`;
    }

    async function init() {
      await refreshProfileBalance();
      await fetchTradeHistory();

      // restore any in-progress client-side timer (no backend required)
      const timerDataJSON = localStorage.getItem(STORAGE_KEY);
      if (timerDataJSON) {
        try {
          const timerData = JSON.parse(timerDataJSON);
          const now = Date.now();
          if (timerData.endsAt && timerData.endsAt > now) {
            // there is still time left — restore popup with stored values
            restorePopupFromStorage(timerData);
          } else {
            // timer expired while user was away — remove and finalize
            localStorage.removeItem(STORAGE_KEY);
            // finalize immediately to sync UI with server (the backend created the trade earlier)
            await finalizeTrade();
          }
        } catch (e) {
          // invalid storage, clear it
          localStorage.removeItem(STORAGE_KEY);
        }
      }
    }

    init();

  </script>

  <footer class="bg-gray-800 text-gray-400 p-2 text-center flex-shrink-0">
    <a href="assets.html" class="underline hover:text-white">View All Trade Details here</a>
  </footer>
</body>
</html>
