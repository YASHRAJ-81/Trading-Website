<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Language</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/i18n.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen flex items-center justify-center px-4">

  <div class="bg-gray-800 rounded-lg shadow-lg p-8 w-full max-w-md text-center">
    
    <!-- Back Button -->
    <div class="text-left mb-6">
      <a href="/profile.html" class="text-sm text-blue-400 hover:underline hover:text-blue-300">&larr; Back to Profile</a>
    </div>

    <!-- Header -->
    <h1 data-i18n="choose_language" class="text-2xl font-bold mb-2">Choose Your Language</h1>
    <p data-i18n="select_language" class="mb-6 text-gray-300">Select a language to continue:</p>

    <!-- Language Buttons -->
    <div class="space-y-4">
      <button onclick="selectAndRedirect('en')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">English</button>
      <button onclick="selectAndRedirect('hi')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">हिन्दी</button>
      <button onclick="selectAndRedirect('ta')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">தமிழ்</button>
      <button onclick="selectAndRedirect('tl')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">Filipino</button>
    </div>
  </div>

  <script>
    function selectAndRedirect(lang) {
      localStorage.setItem("selectedLanguage", lang);
      window.location.href = document.referrer || '/profile.html';
    }
  </script>

</body>
</html>
