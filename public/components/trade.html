<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .active-btn {
      background-color: black;
      border: 1px solid white;
      color: white;
    }
    .active-btn:hover {
      opacity: 0.9;
    }
    body, html {
      height: 100%;
      margin: 0;
      overflow-y: auto;
    }
    #tvChart {
      width: 100%;
      height: 450px;
      border: 0;
      border-radius: 0.5rem;
    }
    .price-up { color: #22c55e; }
    .price-down { color: #ef4444; }
    #pairDropdownBtn {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
    }
    #pairDropdownBtn::after {
      content: '▼';
      font-size: 0.6rem;
      margin-left: 0.25rem;
      user-select: none;
    }
    #pairDropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 8rem;
      margin-top: 0.25rem;
      background-color: #374151;
      border: 1px solid #4b5563;
      border-radius: 0.375rem;
      box-shadow: 0 4px 6px rgb(0 0 0 / 0.1);
      z-index: 50;
      max-height: 15rem;
      overflow-y: auto;
      display: none;
    }
    #pairDropdown.show {
      display: block;
    }
    #pairDropdown div {
      padding: 0.5rem 0.75rem;
      cursor: pointer;
    }
    #pairDropdown div:hover {
      background-color: #4b5563;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

  <!-- Top Bar -->
  <div class="flex items-center p-4 bg-gray-800 shadow-md flex-shrink-0 justify-center relative">
    <button onclick="goToDashboard()" class="absolute left-4 text-xl select-none">←</button>
    <button id="pairDropdownBtn" onclick="toggleDropdown()" class="text-xl font-semibold bg-gray-800 px-4 py-1 rounded select-none" aria-haspopup="listbox" aria-expanded="false">BTC/USDT</button>
    <div id="pairDropdown" role="listbox" aria-labelledby="pairDropdownBtn" tabindex="-1"></div>
  </div>

  <!-- Trading Info -->
  <div class="px-4 py-2 grid grid-cols-2 gap-4 text-sm text-gray-300 flex-shrink-0">
    <div>Open (5m): <span id="open"></span></div>
    <div>Close (5m): <span id="close"></span></div>
    <div>52 Week High: <span id="weekHigh"></span></div>
    <div>52 Week Low: <span id="weekLow"></span></div>
  </div>

  <!-- Chart -->
  <div class="px-2 mt-2">
    <!-- TradingView Widget -->
    <div id="tvChart"></div>
  </div>

  <!-- Trade Controls (2 cm below chart) -->
  <div class="px-4 py-8 space-y-4">
    <div>
      <label class="block mb-1">Direction:</label>
      <div class="flex gap-2">
        <button onclick="openTradeDetails('UP')" class="w-1/2 py-2 rounded bg-green-500" id="btn-up">Buy UP</button>
        <button onclick="openTradeDetails('DOWN')" class="w-1/2 py-2 rounded bg-red-500" id="btn-down">Buy DOWN</button>
      </div>
    </div>
  </div>

  <!-- TradingView Script -->
  <script type="text/javascript">
    function createTradingViewWidget(pair = 'BTCUSDT') {
      const existing = document.getElementById("tradingview-widget");
      if (existing) existing.remove();

      const script = document.createElement("script");
      script.id = "tradingview-widget";
      script.src = "https://s3.tradingview.com/tv.js";
      script.onload = () => {
        new TradingView.widget({
          container_id: "tvChart",
          autosize: true,
          symbol: "BINANCE:" + pair,
          interval: "1",
          timezone: "Etc/UTC",
          theme: "dark",
          style: "1",
          locale: "en",
          toolbar_bg: "#1f2937",
          enable_publishing: false,
          allow_symbol_change: false,
          withdateranges: true,
          hide_side_toolbar: false,
          hide_top_toolbar: false,
          studies: [],
        });
      };
      document.body.appendChild(script);
    }
  </script>

  <script>
    const availablePairs = ['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'ADAUSDT', 'XRPUSDT', 'DOGEUSDT', 'DOTUSDT', 'LTCUSDT', 'LINKUSDT', 'SHIBUSDT', 'ATOMUSDT', 'AVAXUSDT', 'FTTUSDT', 'ETHBTC'];
    let currentPair = 'BTCUSDT';

    async function renderPairList() {
      const container = document.getElementById('pairDropdown');
      container.innerHTML = '';
      for (const pair of availablePairs) {
        const div = document.createElement('div');
        div.textContent = `${pair.slice(0, 3)}/${pair.slice(3)}`;
        div.className = 'select-none text-white hover:bg-gray-600 rounded px-2 py-1 cursor-pointer';
        div.onclick = async () => {
          toggleDropdown();
          await updatePageForPair(pair, true);
        };
        container.appendChild(div);
      }
    }

    function toggleDropdown() {
      const dropdown = document.getElementById('pairDropdown');
      const btn = document.getElementById('pairDropdownBtn');
      const isShown = dropdown.classList.toggle('show');
      btn.setAttribute('aria-expanded', isShown);
    }

    async function updatePageForPair(pair, userClick = false) {
      currentPair = pair;
      document.getElementById('pairDropdownBtn').textContent = `${pair.slice(0, 3)}/${pair.slice(3)}`;
      createTradingViewWidget(pair);

      try {
        const ticker = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${pair}`).then(r => r.json());
        const klines = await fetch(`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=1d&limit=365`).then(r => r.json());
        const k5 = await fetch(`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=5m&limit=2`).then(r => r.json());

        const open5m = +k5[0][1];
        const close5m = +k5[0][4];
        const high52 = Math.max(...klines.map(d => +d[2]));
        const low52 = Math.min(...klines.map(d => +d[3]));

        document.getElementById('open').textContent = open5m.toFixed(6);
        document.getElementById('close').textContent = close5m.toFixed(6);
        document.getElementById('weekHigh').textContent = high52.toFixed(6);
        document.getElementById('weekLow').textContent = low52.toFixed(6);

        colorize(document.getElementById('open'), open5m, close5m);
        colorize(document.getElementById('close'), close5m, open5m);
        colorize(document.getElementById('weekHigh'), +ticker.lastPrice, high52);
        colorize(document.getElementById('weekLow'), +ticker.lastPrice, low52);
      } catch (err) {
        console.warn('Error fetching coin data', err);
      }
    }

    function colorize(el, current, ref) {
      el.classList.remove('price-up', 'price-down');
      if (current > ref) el.classList.add('price-up');
      else if (current < ref) el.classList.add('price-down');
    }

    function openTradeDetails(direction) {
      const params = new URLSearchParams({
        pair: currentPair,
        direction: direction
      });
      window.location.href = `trade-details.html?${params.toString()}`;
    }

    function goToDashboard() {
      window.location.href = '../dashboard.html';
    }

    async function init() {
      await renderPairList();
      await updatePageForPair(currentPair);
    }

    init();
  </script>

</body>
</html>
