<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bind Bank Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/i18n.js"></script>
</head>
<body class="bg-[#0a9376] text-white min-h-screen flex flex-col" data-i18n-init>

  <!-- Header -->
  <div class="relative bg-[#0a9376] px-4 pt-6 pb-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <button onclick="goBack()" class="text-white" aria-label="Go Back">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="text-lg font-semibold">Enter Your Account Details</h1>
      <button id="helpBtn" class="ml-2 text-white" title="Help" aria-label="Help Information" type="button" >
        <!-- Info circle SVG icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <line x1="12" y1="16" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="8" x2="12.01" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Help Message -->
  <div id="helpText" class="text-sm text-yellow-200 text-center px-4 py-2 hidden" role="alert" aria-live="polite">
    If entered wrong details, contact your Receptionist.
  </div>

  <!-- Form -->
  <div class="flex-1 p-4 bg-gray-900 flex flex-col justify-between max-w-md mx-auto w-full">
    <form id="bindCardForm" class="space-y-4" autocomplete="off">
      <div>
        <label for="bankName" class="block mb-1">Bank Name</label>
        <input id="bankName" name="bankName" type="text" class="w-full p-2 rounded text-black" required autocomplete="off" />
      </div>

      <div>
        <label for="accountNumber" class="block mb-1">Account Number</label>
        <div class="relative">
          <input id="accountNumber" name="accountNumber" type="password" class="w-full p-2 pr-10 rounded text-black" required autocomplete="off" />
          <button type="button" id="toggleAccountVisibility" class="absolute inset-y-0 right-2 flex items-center px-2 text-gray-600" aria-label="Toggle account number visibility">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <div>
        <label for="accountHolderName" class="block mb-1">Account Holder Name</label>
        <input id="accountHolderName" name="accountHolderName" type="text" class="w-full p-2 rounded text-black" required autocomplete="off" />
      </div>

      <button type="submit" class="bg-teal-500 w-full py-2 rounded font-semibold text-white">Bind Card</button>

      <p id="successMsg" class="text-gray-400 text-sm text-center mt-3 hidden" role="status" aria-live="polite">
          Submitted to the gateway. Within 1 hour your payment will be cleared.
      </p>
    </form>

    <p class="mt-6 text-xs text-gray-400 text-center px-2">
      🔒 <strong>Highly Confidential:</strong> This is a very secure record. Only the payment gateway has access to this information.
    </p>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }

    // Toggle help text visibility on info button click
    document.getElementById('helpBtn').addEventListener('click', () => {
      const helpText = document.getElementById('helpText');
      helpText.classList.toggle('hidden');
    });

    // Disable form fields and button
    function disableForm() {
      const form = document.getElementById('bindCardForm');
      [...form.elements].forEach(el => el.disabled = true);
    }

    // Check if user is logged in and already submitted bank info
    fetch('/profile-data')
      .then(res => {
        if (res.status === 401) {
          window.location.href = '/login.html';
        }
        return res.json();
      })
      .then(data => {
        if (data.bankBound === true) {
          const form = document.getElementById('bindCardForm');
          form.innerHTML = `
            <p class="text-center text-green-400">✅ Your bank details are already submitted and cannot be changed.</p>
          `;
          disableForm();
        }
      });

    // Toggle account number visibility
    document.getElementById('toggleAccountVisibility').addEventListener('click', () => {
      const input = document.getElementById('accountNumber');
      const icon = document.getElementById('eyeIcon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';

      icon.innerHTML = isHidden
        ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.956 
              9.956 0 012.241-3.66m3.173-2.504A9.956 9.956 0 0112 5c4.477 0 8.268 
              2.943 9.542 7a9.958 9.958 0 01-4.442 5.568M15 12a3 3 0 11-6 0 3 3 
              0 016 0zM3 3l18 18" />`
        : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 
              7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
    });

    // Form submit handler
    document.getElementById('bindCardForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const bankName = this.bankName.value.trim();
      const accountNumber = this.accountNumber.value.trim();
      const accountHolderName = this.accountHolderName.value.trim();

      if (!bankName || !accountNumber || !accountHolderName) {
        alert('Please fill out all fields.');
        return;
      }

      fetch('/bind-bank-card', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bankName, accountNumber, accountHolderName })
      })
      .then(res => {
        if (res.ok) {
          // Show the success message inside the successMsg paragraph
          const msgEl = document.getElementById('successMsg');
          msgEl.classList.remove('hidden');

          // Disable form fields and button to prevent further edits/submissions
          disableForm();

          // Optionally clear the inputs (since disabled now)
          this.bankName.value = '';
          this.accountNumber.value = '';
          this.accountHolderName.value = '';

          // Hide message after 5 seconds (optional)
          setTimeout(() => {
            msgEl.classList.add('hidden');
          }, 5000);
        } else {
          return res.json().then(data => {
            throw new Error(data.message || 'Failed to bind card');
          });
        }
      })
      .catch(err => alert(err.message));
    });
  </script>
</body>
</html>
